# Server
server.port=8099

# H2 (file-based so data persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/pocdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
# Run schema.sql on every startup so the crew_login table is recreated with its new schema.
spring.sql.init.mode=always
spring.jpa.show-sql=true

# Static resources: serve from classpath:/static (default)
# Frontend build output goes to src/main/resources/static
